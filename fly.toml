# fly.toml app configuration file generated for nash-api on 2026-11-24T22:28:34+07:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'nash-api'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
